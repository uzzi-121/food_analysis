<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E111C"/>
      <stop offset="50%" stop-color="#141826"/>
      <stop offset="100%" stop-color="#0B0D15"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="380" rx="20" fill="url(#bgGrad)"/>
  <circle cx="320" cy="190" r="180" fill="url(#glowGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="3" y="3" width="634" height="374" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.9"/>

  <!-- Top Badge: STEP NUMBER -->
  <g transform="translate(32, 28)">
    <rect width="88" height="28" rx="14" fill="#EF4444" fill-opacity="0.18" stroke="#EF4444" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="44" y="19" font-family="'Outfit', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.06em">STEP 03</text>
  </g>

  <!-- Top Right Badge: HEAT / STATUS -->
  <g transform="translate(488, 28)">
    <rect width="120" height="28" rx="14" fill="#1E2235" stroke="#334155" stroke-width="1.2"/>
    <text x="60" y="18" font-family="'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#F59E0B" text-anchor="middle">⚡ 중강불 6분</text>
  </g>

  <!-- Central Visual Illustration -->
  <g filter="url(#shadow)">
    
        <!-- Sizzling Pan with Steam & Oil drops -->
        <ellipse cx="320" cy="210" rx="100" ry="32" fill="#151928" stroke="#EF4444" stroke-width="3"/>
        <line x1="420" y1="210" x2="490" y2="245" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
        <!-- Food inside pan -->
        <rect x="280" y="195" width="22" height="16" rx="4" fill="#FB7185"/>
        <rect x="310" y="200" width="24" height="14" rx="4" fill="#FB7185"/>
        <circle cx="345" cy="205" r="8" fill="#34D399"/>
        <circle cx="295" cy="212" r="7" fill="#34D399"/>
        <rect x="330" y="195" width="20" height="15" rx="3" fill="#FBBF24"/>
        <!-- Sizzling Steam Waves -->
        <path d="M290 170 Q300 150 290 130" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
        <path d="M320 165 Q330 145 320 125" stroke="#F59E0B" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.9"/>
        <path d="M350 170 Q360 150 350 130" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
        
  </g>

  <!-- Bottom Title & Guide Card -->
  <g transform="translate(24, 280)">
    <rect width="592" height="76" rx="14" fill="#121624" fill-opacity="0.92" stroke="#262D42" stroke-width="1"/>
    <text x="24" y="32" font-family="'Pretendard', -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">센 불에서 바삭하게 부치기</text>
    <text x="24" y="56" font-family="'Pretendard', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">기름을 넉넉히 두르고 가장자리부터 튀기듯 바삭하게</text>
    <!-- Accent Dot -->
    <circle cx="560" cy="38" r="5" fill="#EF4444"/>
  </g>
</svg>